<style>
:root{color-scheme:light;--ink:#1c304b;--blue:#326fba;--cream:#fcf8eb;--red:#ed6261}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink)}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;overscroll-behavior-x:none}main{min-height:100svh;max-width:680px;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 10px 32px}h1{font-size:clamp(19px,5.45vw,36px);font-weight:900;letter-spacing:-.055em;line-height:1.2;white-space:nowrap;margin:0;color:var(--blue);text-shadow:0 2px #fff,0 3px #1c304b24}.subtitle{font:700 clamp(10px,2.7vw,13px)/1.5 ui-monospace,monospace;letter-spacing:.1em;margin:10px 0 43px;white-space:nowrap}.name{font:900 clamp(16px,4.2vw,21px)/1.2 ui-monospace,monospace;letter-spacing:.08em}.stage{position:relative;width:min(88vw,360px);margin:8px 0 18px;isolation:isolate}.boss{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 85%}.stage svg{user-select:none}.outline{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}.hp{font:900 25px ui-monospace,monospace;fill:var(--ink)}.sweat,.bandage,.crack,.dizzy{opacity:0}.eye{transform-box:fill-box;transform-origin:center}.mouth{display:none}.smug{display:block}.boss[data-mood="annoyed"] .smug,.boss[data-mood="nervous"] .smug,.boss[data-mood="panicking"] .smug,.boss[data-mood="barely"] .smug,.boss[data-mood="alive"] .smug{display:none}.boss[data-mood="annoyed"] .frown,.boss[data-mood="nervous"] .worried,.boss[data-mood="panicking"] .worried,.boss[data-mood="barely"] .worried,.boss[data-mood="alive"] .tired{display:block}.boss[data-mood="nervous"] .sweat.one,.boss[data-mood="panicking"] .sweat,.boss[data-mood="barely"] .sweat,.boss[data-mood="alive"] .sweat{opacity:1}.boss[data-mood="barely"] .bandage,.boss[data-mood="alive"] .bandage,.boss[data-mood="alive"] .crack,.boss[data-mood="barely"] .dizzy,.boss[data-mood="alive"] .dizzy{opacity:1}. @keyframes recoil{25%{transform:translateX(-6px) scale(.97) rotate(-2deg)}60%{transform:translateX(7px) scale(1.02) rotate(1deg)}100%{transform:none}}@keyframes press{40%{transform:translateY(5px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes damage{0%{opacity:1;transform:translate(-50%,0) scale(.85)}30%{transform:translate(-50%,-12px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-44px)}}@keyframes impact{to{opacity:0;transform:translateY(-12px) rotate(25deg) scale(1.3)}}@keyframes idle{0%,90%,100%{transform:none}94%{transform:rotate(-1deg)}97%{transform:rotate(1deg)}}@keyframes die{to{transform:translateY(-70px) rotate(25deg) scale(.1);opacity:0}}

</style></head><body><main>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),card=$('card'),boss=$('boss'),status=$('status');
let state=null,queue=[],unbatched=0,preload=0,sending=false,polling=false,locked=false,nextState=null,combo=0,comboTimer,feedbackTimer,lastHit=0;
let visitorId;try{visitorId=localStorage.getItem('codex-reset-raid-visitor-id');if(!/^[0-9a-f-]{36}$/i.test(visitorId||'')){visitorId=crypto.randomUUID();localStorage.setItem('codex-reset-raid-visitor-id',visitorId)}}catch{visitorId=crypto.randomUUID()}
let joinedRound;try{joinedRound=sessionStorage.getItem('codex-reset-raid-joined-round')}catch{}
const pending=()=>unbatched+queue.reduce((n,b)=>n+b.hits,0);
function health(hits,k=5000,dead=false){if(dead)return '0%';const log=2-hits/(k*Math.LN10);if(log < -7){const exponent=Math.floor(log),mantissa=Math.pow(10,log-exponent);return mantissa.toFixed(1)+'e'+exponent+'%'}const n=Math.pow(10,log),places=log>=1?0:Math.max(1,1-Math.floor(log));return n.toFixed(places)+'%'}
function age(date){const m=Math.max(0,Math.floor((Date.now()-Date.parse(date))/60000));if(m<60)return m+'m ago';const h=Math.floor(m/60);return h<24?h+'h '+m%60+'m ago':Math.floor(h/24)+'d '+h%24+'h ago'}
function render(){if(!state)return;const hits=state.hits+pending(),log=2-hits/(state.hpDecayK*Math.LN10);$('hits').textContent=hits.toLocaleString('en-US');$('fans').textContent=(state.fans+(pending()>0&&joinedRound!==state.roundId?1:0)).toLocaleString('en-US');$('hp').textContent=health(hits,state.hpDecayK);$('quota-fill').setAttribute('width',Math.max(1.5,247*Math.pow(10,Math.max(-10,log))/100));boss.dataset.mood=log>=Math.log10(50)?'smug':log>=1?'annoyed':log>=0?'nervous':log>=-1?'panicking':log>=-2?'barely':'alive';$('last').textContent='Last full reset: '+age(state.lastResetAt);$('last').href=state.sourceUrl;}
function tell(text){status.textContent=text;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>status.textContent='',2500)}
function accept(s){if(!s || !s.roundId)return;if(locked){nextState=s;return}if(state&&state.roundId!==s.roundId){transition(s);return}if(state){s.hits=Math.max(state.hits,s.hits);s.fans=Math.max(state.fans,s.fans);}state=s;if(preload){unbatched=Math.min(500,unbatched+preload);preload=0}render()}
function transition(s){locked=true;nextState=s;queue=[];unbatched=0;combo=0;$('combo').textContent='';$('hp').textContent=health(0,5000,true);$('quota-fill').setAttribute('width',0);$('announcement').textContent='Full reset. Tibo landed the final hit.';setTimeout(()=>{boss.classList.add('dead');$('overlay').hidden=false},300);setTimeout(()=>{state=nextState;nextState=null;joinedRound=null;boss.classList.remove('dead');$('overlay').hidden=true;locked=false;render();tell('A NEW QUOTA BEAST APPEARED.')},2600)}
function makeBatches(){while(unbatched>0&&state){const hits=Math.min(50,unbatched);queue.push({roundId:state.roundId,visitorId,batchId:crypto.randomUUID(),hits});unbatched-=hits}}
async function flush(keepalive=false){if(!state||locked)return;makeBatches();if(sending||!queue.length)return;sending=true;const b=queue[0];try{const r=await fetch('/api/hit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),keepalive,signal:AbortSignal.timeout(10000)});const s=await r.json();if(!state||b.roundId!==state.roundId||locked)return;if(r.status===409&&s.error==='round_changed'){accept(s);return}if(!r.ok)throw Error('hit failed');if(queue[0]===b)queue.shift();joinedRound=b.roundId;try{sessionStorage.setItem('codex-reset-raid-joined-round',joinedRound)}catch{}accept(s);}catch{tell('TRY AGAIN IN A MOMENT')}finally{sending=false}}
async function poll(){if(polling||document.visibilityState!=='visible')return;polling=true;try{const r=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('state failed');accept(await r.json())}catch{tell('TRY AGAIN IN A MOMENT')}finally{polling=false}}
card.addEventListener('click',()=>{if(locked)return;const now=performance.now();combo=now-lastHit<700?combo+1:1;lastHit=now;clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;$('combo').textContent=''},700);$('combo').textContent=combo>=3?'x'+combo+' COMBO':'';for(const el of[boss,card]){el.classList.remove('struck');void el.getBoundingClientRect();el.classList.add('struck')}const d=document.createElement('span');d.className='damage';d.textContent='-1';d.style.setProperty('--x',(45+Math.random()*10)+'%');$('stage').append(d);setTimeout(()=>d.remove(),350);const star=document.createElement('span');star.className='impact';star.textContent='✦';star.style.setProperty('--x',(Math.random()<.5?21:73)+'%');$('stage').append(star);setTimeout(()=>star.remove(),260);if(state){if(pending()<500)unbatched++;else tell('TRY AGAIN IN A MOMENT');render();if(unbatched>=20)flush()}else{preload=Math.min(500,preload+1);$('hits').textContent=preload.toLocaleString('en-US');poll()}});
for(const el of[boss,card])el.addEventListener('animationend',()=>el.classList.remove('struck'));
setInterval(()=>flush(),1000);setInterval(poll,10000);setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush(true);else{poll();flush()}});addEventListener('pagehide',()=>flush(true));poll();
})();
</script></body></html>
